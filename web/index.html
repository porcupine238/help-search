<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu hướng dẫn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="./" class="brand">Tra cứu.</a>
      <span class="brand-note">Hướng dẫn nội bộ</span>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="signin-view" class="hero" hidden>
      <p class="eyebrow">Thư viện hướng dẫn</p>
      <h1 class="hero-title">Tìm câu trả lời <em>trong vài giây</em></h1>
      <p class="hero-lead">Đăng nhập bằng Gmail đã được cấp quyền để tra cứu bài hướng dẫn.</p>
      <div class="signin-card">
        <div id="signin-button"></div>
      </div>
    </section>

    <section id="search-view" hidden>
      <div class="user-bar">
        <span id="user-email"></span>
        <button id="signout-button" type="button" class="link-button">Đăng xuất</button>
      </div>
      <div class="hero">
        <p class="eyebrow">Thư viện hướng dẫn</p>
        <h1 class="hero-title">Bạn cần <em>hướng dẫn</em> gì?</h1>
      </div>
      <form id="search-form" class="search-form" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search-input" type="search" autocomplete="off"
          placeholder="Ví dụ: quên mật khẩu" aria-label="Tìm bài hướng dẫn">
      </form>
      <ul id="result-list" class="result-list"></ul>
    </section>

    <section id="article-view" hidden>
      <button id="back-button" type="button" class="pill-button">← Quay lại</button>
      <article id="article-body" class="article-body"></article>
    </section>

    <footer class="app-footer"><a href="privacy.html">Chính sách quyền riêng tư</a></footer>
  </main>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
    integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
    integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
